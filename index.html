<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Sentence Clause Builder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --pinyin-color: #94a3b8;
      --gloss-color: #38bdf8;
      --success: #10b981;
      --error: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --tile-bg: #334155;
      --tile-hover: #475569;

      /* Tone Colors */
      --tone-1: #60a5fa; /* Blue - 1st Tone */
      --tone-2: #34d399; /* Green - 2nd Tone */
      --tone-3: #fbbf24; /* Orange - 3rd Tone */
      --tone-4: #f87171; /* Red - 4th Tone */
      --tone-0: #cbd5e1; /* Silver - Neutral / No Tone */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { max-width: 700px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    
    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.6rem; color: #60a5fa; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; }

    .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    
    .progress-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.85rem; color: var(--text-muted); }
    .dots { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; }
    .dot.active { background: var(--accent); transform: scale(1.2); }
    .dot.done { background: var(--success); }

    .english-prompt { font-size: 1.15rem; font-weight: 600; color: #f1f5f9; margin-bottom: 12px; }

    /* English Clause Correspondence Tracker */
    .clause-tracker { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; padding: 10px; background: rgba(15, 23, 42, 0.4); border-radius: 8px; border: 1px solid #334155; max-height: 150px; overflow-y: auto; }
    .clause-tracker-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 2px; }
    .english-clause-item { padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; color: var(--text-muted); background: rgba(255,255,255,0.02); transition: all 0.2s; border-left: 3px solid transparent; }
    .english-clause-item.upcoming { color: #cbd5e1; border-left-color: #475569; background: rgba(255,255,255,0.04); }
    .english-clause-item.active { color: #ffffff; background: rgba(59, 130, 246, 0.15); border-left-color: var(--accent); font-weight: 600; box-shadow: 0 2px 8px rgba(59,130,246,0.1); }
    .english-clause-item.completed { color: #a7f3d0; background: rgba(16, 185, 129, 0.1); border-left-color: var(--success); opacity: 0.8; }

    /* Sentence Build Area - Fixed height with auto-scroll */
    .sentence-zone { 
      height: 130px; 
      min-height: 130px; 
      max-height: 130px; 
      overflow-y: auto; 
      border: 2px dashed #475569; 
      border-radius: 10px; 
      padding: 12px; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      align-content: flex-start; 
      margin-bottom: 20px; 
      transition: border-color 0.2s; 
      scroll-behavior: smooth;
    }
    .sentence-zone.wrong { border-color: var(--error); animation: shake 0.3s; }
    
    /* Clause Checkpoint Container */
    .clause-group { display: flex; gap: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,0.03); flex-wrap: wrap; border: 1px solid transparent; align-items: center; }
    .clause-group.active-draft { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05); }
    .clause-group.completed { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); }

    /* Word Bank Header */
    .word-bank-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .word-bank-actions { display: flex; gap: 6px; }
    
    /* Tiny Active Clause Hint right above word bank */
    .active-clause-hint {
      font-size: 0.72rem;
      color: #93c5fd;
      margin-bottom: 8px;
      font-style: italic;
      letter-spacing: 0.02em;
      opacity: 0.9;
    }

    /* Word Tiles */
    .tile { 
      background: var(--tile-bg); 
      color: var(--text); 
      border: 1px solid transparent; 
      padding: 6px 14px; 
      border-radius: 8px; 
      cursor: pointer; 
      user-select: none; 
      transition: all 0.15s ease; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 48px;
    }
    
    .tile .pinyin-text {
      font-size: 0.72rem;
      color: var(--pinyin-color);
      font-weight: 500;
      line-height: 1.1;
      margin-bottom: 2px;
      opacity: 0.50; 
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .tile .gloss-text {
      font-size: 0.70rem;
      color: var(--gloss-color);
      font-weight: 500;
      line-height: 1.1;
      margin-top: 2px;
      display: none;
    }

    .show-gloss .tile .gloss-text {
      display: block;
    }

    .tile .char-container {
      display: inline-flex;
      gap: 2px;
    }

    .tile .char-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .tile:hover:not(:disabled) .pinyin-text {
      opacity: 0.90;
      color: #93c5fd;
    }

    .tile:hover:not(:disabled) { background: var(--tile-hover); transform: translateY(-2px); }

    .tile:disabled, .tile[disabled] { 
      opacity: 0.15 !important; 
      cursor: default !important; 
      transform: none !important; 
      box-shadow: none !important; 
      border-color: transparent !important;
      background: var(--tile-bg) !important;
    }

    .tile.locked { background: #064e3b !important; cursor: default; border-color: transparent !important; opacity: 1 !important; }
    .tile.locked .pinyin-text { color: #6ee7b7; opacity: 0.75; }

    /* Word Bank */
    .word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 100px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; transition: background 0.2s; }
    .word-bank.clickable-reset { cursor: pointer; border: 1px dashed rgba(16, 185, 129, 0.4); }
    .word-bank.clickable-reset:hover { background: rgba(16, 185, 129, 0.05); }

    /* Controls */
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .btn { background: var(--tile-bg); color: var(--text); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
    .btn:hover { background: var(--tile-hover); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn.active-toggle { background: var(--accent); color: white; }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }

    textarea { width: 100%; height: 120px; background: #0f172a; color: #a5f3fc; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.85rem; margin-top: 10px; resize: vertical; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Chinese Clause Builder</h1>
    <p class="subtitle">Focus clause by clause & practice at your own pace!</p>
  </header>

  <div class="card" id="game-card">
    <div class="progress-bar">
      <span id="sentence-counter">Sentence 1 of 10</span>
      <div class="dots" id="dots-container"></div>
    </div>

    <div class="english-prompt" id="english-text">Loading...</div>

    <!-- Visual Clause Correspondence Tracker -->
    <div class="clause-tracker" id="clause-tracker" style="display: none;">
      <div class="clause-tracker-title">Clause Breakdown & Navigation:</div>
      <div id="clause-tracker-list"></div>
    </div>

    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">Tap words in correct order:</p>
    <div class="sentence-zone" id="sentence-zone"></div>

    <!-- Word Bank Header with Gloss & Reset -->
    <div class="word-bank-header">
      <span style="font-size: 0.8rem; color: var(--text-muted);" id="word-bank-label">Current Clause Word Bank:</span>
      <div class="word-bank-actions">
        <button class="btn btn-sm" id="toggle-gloss-btn">🔤 Gloss: OFF</button>
        <button class="btn btn-sm" id="reset-clause-btn">🔄 Clear Draft</button>
      </div>
    </div>
    <div id="active-clause-hint" class="active-clause-hint"></div>
    
    <div class="word-bank" id="word-bank"></div>

    <div class="controls">
      <button class="btn" id="json-toggle">📥 Load New JSON</button>
      <div style="display: flex; gap: 8px;">
        <button class="btn" id="prev-clause-btn" style="display: none;">← Prev Clause</button>
        <button class="btn btn-primary" id="next-clause-btn" style="display: none;">Next Clause ➔</button>
        <button class="btn btn-primary" id="next-sentence-btn" style="display: none;">Next Sentence ➔</button>
      </div>
    </div>
  </div>

  <div class="card" id="json-card" style="display: none;">
    <h3>Paste AI JSON Output Here:</h3>
    <textarea id="json-input" placeholder="Paste JSON generated by Gemini/ChatGPT here..."></textarea>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn btn-primary" id="load-json-btn">Load Sentences</button>
      <button class="btn" id="clear-json-btn">Clear Text</button>
    </div>
  </div>
</div>

<script>
  const rawDefaultData = [
    {
      english: "I want to drink hot tea today because I have a cold.",
      clauses: [
        {
          english: "I want to drink hot tea today",
          chinese: [ 
            {word: "我", pinyin: "wǒ", gloss: "I"}, 
            {word: "今天", pinyin: "jīn tiān", gloss: "today"}, 
            {word: "想", pinyin: "xiǎng", gloss: "want"}, 
            {word: "喝", pinyin: "hē", gloss: "drink"}, 
            {word: "热茶", pinyin: "rè chá", gloss: "hot tea"} 
          ]
        },
        {
          english: "because I have a cold.",
          chinese: [ 
            {word: "因为", pinyin: "yīn wèi", gloss: "because"}, 
            {word: "我", pinyin: "wǒ", gloss: "I"}, 
            {word: "感冒了", pinyin: "gǎn mào le", gloss: "catch cold"} 
          ]
        }
      ]
    }
  ];

  let sentences = [];
  let currentIdx = 0;
  
  let currentClauseIdx = 0;
  let currentWordInClauseIdx = 0;
  let clauseWordBank = [];
  let usedTileIds = new Set();
  let activeClauseTiles = [];
  let completedClausesMap = {};
  let showGloss = false;

  const gameCard = document.getElementById('game-card');
  const englishEl = document.getElementById('english-text');
  const clauseTracker = document.getElementById('clause-tracker');
  const clauseTrackerList = document.getElementById('clause-tracker-list');
  const activeClauseHint = document.getElementById('active-clause-hint');
  const sentenceZone = document.getElementById('sentence-zone');
  const wordBankEl = document.getElementById('word-bank');
  const wordBankLabel = document.getElementById('word-bank-label');
  const counterEl = document.getElementById('sentence-counter');
  const dotsEl = document.getElementById('dots-container');
  const nextSentenceBtn = document.getElementById('next-sentence-btn');
  const nextClauseBtn = document.getElementById('next-clause-btn');
  const prevClauseBtn = document.getElementById('prev-clause-btn');
  const resetClauseBtn = document.getElementById('reset-clause-btn');
  const toggleGlossBtn = document.getElementById('toggle-gloss-btn');
  const jsonToggle = document.getElementById('json-toggle');
  const jsonCard = document.getElementById('json-card');
  const jsonInput = document.getElementById('json-input');
  const loadJsonBtn = document.getElementById('load-json-btn');
  const clearJsonBtn = document.getElementById('clear-json-btn');

  function getToneFromSyllable(s) {
    if (/[āēīōūǖĀĒĪŌŪǕ]/.test(s)) return 1;
    if (/[áéíóúǘÁÉÍÓÚǗ]/.test(s)) return 2;
    if (/[ǎěǐǒǔǚǍĚǏǑǓǙ]/.test(s)) return 3;
    if (/[àèìòùǜÀÈÌÒÙǛ]/.test(s)) return 4;
    return 0;
  }

  function getToneColorVar(tone) {
    switch(tone) {
      case 1: return 'var(--tone-1)';
      case 2: return 'var(--tone-2)';
      case 3: return 'var(--tone-3)';
      case 4: return 'var(--tone-4)';
      default: return 'var(--tone-0)';
    }
  }

  function normalizeData(raw) {
    return raw.map(s => {
      let clausesNormalized = [];
      if (Array.isArray(s.clauses)) {
        clausesNormalized = s.clauses.map((c, cIdx) => {
          if (c && !Array.isArray(c) && c.chinese) {
            return {
              english: c.english || `Clause ${cIdx + 1}`,
              chinese: c.chinese.map(item => ({
                word: item.word || item.char || '',
                pinyin: item.pinyin || '',
                gloss: item.gloss || ''
              }))
            };
          }
          if (Array.isArray(c)) {
            return {
              english: `Clause ${cIdx + 1}`,
              chinese: c.map(item => {
                if (typeof item === 'string') return { word: item, pinyin: '', gloss: '' };
                return { word: item.word || item.char || '', pinyin: item.pinyin || '', gloss: item.gloss || '' };
              })
            };
          }
          return { english: '', chinese: [] };
        });
      }
      return {
        english: s.english || '',
        clauses: clausesNormalized
      };
    });
  }

  function initGame() {
    sentences = normalizeData(rawDefaultData);
    renderDots();
    loadSentence(currentIdx);
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    sentences.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.className = `dot ${idx === currentIdx ? 'active' : ''} ${idx < currentIdx ? 'done' : ''}`;
      dotsEl.appendChild(dot);
    });
  }

  function loadSentence(index) {
    nextSentenceBtn.style.display = 'none';
    nextClauseBtn.style.display = 'none';
    currentClauseIdx = 0;
    completedClausesMap = {};
    
    const item = sentences[index];
    counterEl.innerText = `Sentence ${index + 1} of ${sentences.length}`;
    englishEl.innerText = item.english;

    if (item.clauses && item.clauses.length > 1) {
      clauseTracker.style.display = 'flex';
    } else {
      clauseTracker.style.display = 'none';
    }

    loadClause(0);
  }

  function loadClause(cIdx) {
    currentClauseIdx = cIdx;
    currentWordInClauseIdx = 0;
    usedTileIds.clear();
    activeClauseTiles = [];
    nextClauseBtn.style.display = 'none';

    const currentSentence = sentences[currentIdx];
    const clauseObj = currentSentence.clauses[currentClauseIdx];

    let tiles = [];
    clauseObj.chinese.forEach((wordObj, wIdx) => {
      tiles.push({
        id: `tile-${currentClauseIdx}-${wIdx}-${Math.random().toString(36).substr(2, 6)}`,
        word: wordObj.word,
        pinyin: wordObj.pinyin,
        gloss: wordObj.gloss
      });
    });

    clauseWordBank = tiles.sort(() => Math.random() - 0.5);
    renderBoard();
  }

  function renderClauseTracker(item) {
    clauseTrackerList.innerHTML = '';
    item.clauses.forEach((cObj, idx) => {
      const div = document.createElement('div');
      div.className = 'english-clause-item';
      
      if (completedClausesMap[idx]) {
        div.className += ' completed';
        div.innerText = `✓ ${cObj.english}`;
      } else if (idx === currentClauseIdx) {
        div.className += ' active';
        div.innerText = `▶ ${cObj.english} (Current)`;
      } else {
        div.className += ' upcoming';
        div.innerText = `${idx + 1}. ${cObj.english}`;
      }

      div.style.cursor = 'pointer';
      div.onclick = () => {
        loadClause(idx);
      };

      clauseTrackerList.appendChild(div);
    });
  }

  function createTileElement(tileObj, isLocked = false) {
    const el = document.createElement('div');
    el.className = `tile ${isLocked ? 'locked' : ''}`;
    
    if (tileObj.pinyin) {
      const pinyinSpan = document.createElement('span');
      pinyinSpan.className = 'pinyin-text';
      pinyinSpan.innerText = tileObj.pinyin;
      el.appendChild(pinyinSpan);
    }

    const charContainer = document.createElement('div');
    charContainer.className = 'char-container';

    const chars = Array.from(tileObj.word || '');
    const syllables = (tileObj.pinyin || '').trim().split(/\s+/);

    chars.forEach((char, idx) => {
      const charSpan = document.createElement('span');
      charSpan.className = 'char-text';
      charSpan.innerText = char;

      const syllable = syllables[idx] || syllables[0] || '';
      const tone = getToneFromSyllable(syllable);
      charSpan.style.color = getToneColorVar(tone);

      charContainer.appendChild(charSpan);
    });

    el.appendChild(charContainer);

    if (tileObj.gloss) {
      const glossSpan = document.createElement('span');
      glossSpan.className = 'gloss-text';
      glossSpan.innerText = tileObj.gloss;
      el.appendChild(glossSpan);
    }

    return el;
  }

  function renderBoard() {
    const currentSentence = sentences[currentIdx];
    sentenceZone.innerHTML = '';

    if (currentSentence.clauses && currentSentence.clauses.length > 1) {
      renderClauseTracker(currentSentence);
    }

    const activeClauseObj = currentSentence.clauses[currentClauseIdx];
    activeClauseHint.innerText = `🎯 Target Clause: "${activeClauseObj.english}"`;
    activeClauseHint.style.display = 'block';

    // 1. Render all clauses in sentence zone
    currentSentence.clauses.forEach((cObj, idx) => {
      if (completedClausesMap[idx]) {
        const group = document.createElement('div');
        group.className = 'clause-group completed';
        completedClausesMap[idx].forEach(tileObj => {
          group.appendChild(createTileElement(tileObj, true));
        });
        sentenceZone.appendChild(group);
      }
    });

    // 2. Render Active Clause Draft
    if (!completedClausesMap[currentClauseIdx]) {
      const activeGroup = document.createElement('div');
      activeGroup.className = 'clause-group active-draft';
      activeClauseTiles.forEach(tileObj => {
        activeGroup.appendChild(createTileElement(tileObj, false));
      });
      sentenceZone.appendChild(activeGroup);
    }

    // 3. Render Scrambled Word Bank
    wordBankEl.innerHTML = '';
    const isClauseDone = !!completedClausesMap[currentClauseIdx];

    if (isClauseDone) {
      wordBankEl.classList.add('clickable-reset');
      wordBankLabel.innerText = 'Current Clause Word Bank (Tap here to reset & practice again):';
      wordBankEl.onclick = () => {
        delete completedClausesMap[currentClauseIdx];
        loadClause(currentClauseIdx);
      };
    } else {
      wordBankEl.classList.remove('clickable-reset');
      wordBankLabel.innerText = 'Current Clause Word Bank:';
      wordBankEl.onclick = null;
    }

    clauseWordBank.forEach(tileObj => {
      const btn = createTileElement(tileObj, false);
      btn.tagName = 'BUTTON';

      const isUsed = usedTileIds.has(tileObj.id);
      if (isUsed || isClauseDone) {
        btn.setAttribute('disabled', 'true');
      } else {
        btn.onclick = (e) => {
          e.stopPropagation(); // Prevent triggering word bank click handler
          handleTileClick(tileObj);
        };
      }

      wordBankEl.appendChild(btn);
    });

    // Navigation buttons visibility
    prevClauseBtn.style.display = currentClauseIdx > 0 ? 'inline-block' : 'none';

    if (isClauseDone) {
      if (currentClauseIdx < currentSentence.clauses.length - 1) {
        nextClauseBtn.style.display = 'inline-block';
        nextSentenceBtn.style.display = 'none';
      } else {
        const allDone = currentSentence.clauses.every((_, i) => completedClausesMap[i]);
        if (allDone) {
          nextClauseBtn.style.display = 'none';
          nextSentenceBtn.style.display = 'inline-block';
        }
      }
    } else {
      nextClauseBtn.style.display = 'none';
    }

    // Gloss state
    if (showGloss) {
      gameCard.classList.add('show-gloss');
      toggleGlossBtn.innerText = '🔤 Gloss: ON';
      toggleGlossBtn.classList.add('active-toggle');
    } else {
      gameCard.classList.remove('show-gloss');
      toggleGlossBtn.innerText = '🔤 Gloss: OFF';
      toggleGlossBtn.classList.remove('active-toggle');
    }

    renderDots();
    sentenceZone.scrollTop = sentenceZone.scrollHeight;
  }

  function handleTileClick(tileObj) {
    const currentSentence = sentences[currentIdx];
    const expectedWordObj = currentSentence.clauses[currentClauseIdx].chinese[currentWordInClauseIdx];

    if (tileObj.word === expectedWordObj.word) {
      usedTileIds.add(tileObj.id);
      activeClauseTiles.push(tileObj);
      currentWordInClauseIdx++;

      if (currentWordInClauseIdx >= currentSentence.clauses[currentClauseIdx].chinese.length) {
        completedClausesMap[currentClauseIdx] = [...activeClauseTiles];
        activeClauseTiles = [];
      }

      renderBoard();
    } else {
      sentenceZone.classList.add('wrong');
      setTimeout(() => sentenceZone.classList.remove('wrong'), 400);

      activeClauseTiles.forEach(t => usedTileIds.delete(t.id));
      activeClauseTiles = [];
      currentWordInClauseIdx = 0;

      renderBoard();
    }
  }

  nextClauseBtn.onclick = () => {
    const currentSentence = sentences[currentIdx];
    if (currentClauseIdx < currentSentence.clauses.length - 1) {
      loadClause(currentClauseIdx + 1);
    }
  };

  prevClauseBtn.onclick = () => {
    if (currentClauseIdx > 0) {
      loadClause(currentClauseIdx - 1);
    }
  };

  resetClauseBtn.onclick = () => {
    delete completedClausesMap[currentClauseIdx];
    loadClause(currentClauseIdx);
  };

  nextSentenceBtn.onclick = () => {
    if (currentIdx < sentences.length - 1) {
      currentIdx++;
      loadSentence(currentIdx);
    } else {
      alert('🎉 Fantastic job! You finished all sentences in this set!');
    }
  };

  toggleGlossBtn.onclick = () => {
    showGloss = !showGloss;
    renderBoard();
  };

  jsonToggle.onclick = () => {
    jsonCard.style.display = jsonCard.style.display === 'none' ? 'block' : 'none';
  };

  clearJsonBtn.onclick = () => {
    jsonInput.value = '';
    jsonInput.focus();
  };

  loadJsonBtn.onclick = () => {
    try {
      const parsed = JSON.parse(jsonInput.value.trim());
      if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].clauses) {
        sentences = normalizeData(parsed);
        currentIdx = 0;
        jsonCard.style.display = 'none';
        renderDots();
        loadSentence(0);
      } else {
        alert('Invalid format. Ensure it matches the JSON prompt output.');
      }
    } catch (e) {
      alert('Error parsing JSON. Please check for syntax errors.');
    }
  };

  initGame();
</script>
