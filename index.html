<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Sentence Clause Builder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --pinyin-color: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --tile-bg: #334155;
      --tile-hover: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { max-width: 700px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    
    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.6rem; color: #60a5fa; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; }

    .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    
    .progress-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.85rem; color: var(--text-muted); }
    .dots { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; }
    .dot.active { background: var(--accent); transform: scale(1.2); }
    .dot.done { background: var(--success); }

    .english-prompt { font-size: 1.15rem; font-weight: 600; color: #f1f5f9; margin-bottom: 12px; }

    /* English Clause Correspondence Tracker */
    .clause-tracker { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; padding: 10px; background: rgba(15, 23, 42, 0.4); border-radius: 8px; border: 1px solid #334155; max-height: 150px; overflow-y: auto; }
    .clause-tracker-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 2px; }
    .english-clause-item { padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; color: var(--text-muted); background: rgba(255,255,255,0.02); transition: all 0.2s; border-left: 3px solid transparent; }
    .english-clause-item.upcoming { color: #cbd5e1; border-left-color: #475569; background: rgba(255,255,255,0.04); }
    .english-clause-item.active { color: #ffffff; background: rgba(59, 130, 246, 0.15); border-left-color: var(--accent); font-weight: 600; box-shadow: 0 2px 8px rgba(59,130,246,0.1); }
    .english-clause-item.completed { color: #a7f3d0; background: rgba(16, 185, 129, 0.1); border-left-color: var(--success); opacity: 0.8; }

    /* Sentence Build Area - Fixed height with internal scroll to keep word bank locked in place */
    .sentence-zone { 
      height: 130px; 
      min-height: 130px; 
      max-height: 130px; 
      overflow-y: auto; 
      border: 2px dashed #475569; 
      border-radius: 10px; 
      padding: 12px; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      align-content: flex-start; 
      margin-bottom: 20px; 
      transition: border-color 0.2s; 
    }
    .sentence-zone.wrong { border-color: var(--error); animation: shake 0.3s; }
    
    /* Clause Checkpoint Container */
    .clause-group { display: flex; gap: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,0.03); flex-wrap: wrap; border: 1px solid transparent; }
    .clause-group.active-draft { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05); }
    .clause-group.completed { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); }

    /* Word Bank Header */
    .word-bank-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    
    /* Tiny Active Clause Hint right above word bank */
    .active-clause-hint {
      font-size: 0.72rem;
      color: #93c5fd;
      margin-bottom: 8px;
      font-style: italic;
      letter-spacing: 0.02em;
      opacity: 0.9;
    }

    /* Word Tiles with Subtle Pinyin */
    .tile { 
      background: var(--tile-bg); 
      color: var(--text); 
      border: 1px solid transparent; 
      padding: 6px 14px; 
      border-radius: 8px; 
      cursor: pointer; 
      user-select: none; 
      transition: all 0.15s ease; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 48px;
    }
    
    .tile .pinyin-text {
      font-size: 0.72rem;
      color: var(--pinyin-color);
      font-weight: 500;
      line-height: 1.1;
      margin-bottom: 2px;
      opacity: 0.50; 
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .tile .char-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .tile:hover:not(:disabled) .pinyin-text {
      opacity: 0.90;
      color: #93c5fd;
    }

    .tile:hover:not(:disabled) { background: var(--tile-hover); transform: translateY(-2px); }
    
    .tile.active-clause-tile:not(:disabled) {
      background: #1e293b;
      border: 1px solid rgba(96, 165, 250, 0.4);
    }
    .tile.active-clause-tile:hover:not(:disabled) {
      background: #334155;
    }

    .tile:disabled, .tile[disabled] { 
      opacity: 0.15 !important; 
      cursor: default !important; 
      transform: none !important; 
      box-shadow: none !important; 
      border-color: transparent !important;
      background: var(--tile-bg) !important;
    }

    .tile.locked { background: #064e3b !important; color: #a7f3d0 !important; cursor: default; border-color: transparent !important; opacity: 1 !important; }
    .tile.locked .pinyin-text { color: #6ee7b7; opacity: 0.85; }

    /* Word Bank */
    .word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 100px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; }

    /* Controls */
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .btn { background: var(--tile-bg); color: var(--text); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
    .btn:hover { background: var(--tile-hover); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }

    textarea { width: 100%; height: 120px; background: #0f172a; color: #a5f3fc; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.85rem; margin-top: 10px; resize: vertical; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Chinese Clause Builder</h1>
    <p class="subtitle">Mistakes reset only the current clause checkpoint!</p>
  </header>

  <div class="card">
    <div class="progress-bar">
      <span id="sentence-counter">Sentence 1 of 10</span>
      <div class="dots" id="dots-container"></div>
    </div>

    <div class="english-prompt" id="english-text">Loading...</div>

    <!-- Visual Clause Correspondence Tracker -->
    <div class="clause-tracker" id="clause-tracker" style="display: none;">
      <div class="clause-tracker-title">Clause Breakdown & Target:</div>
      <div id="clause-tracker-list"></div>
    </div>

    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">Tap words in correct order:</p>
    <div class="sentence-zone" id="sentence-zone"></div>

    <!-- Word Bank Header with Tiny Active Clause Hint -->
    <div class="word-bank-header">
      <span style="font-size: 0.8rem; color: var(--text-muted);">Word Bank:</span>
      <button class="btn btn-sm" id="reset-clause-btn">🔄 Reset Clause</button>
    </div>
    <div id="active-clause-hint" class="active-clause-hint"></div>
    
    <div class="word-bank" id="word-bank"></div>

    <div class="controls">
      <button class="btn" id="json-toggle">📥 Load New JSON</button>
      <button class="btn btn-primary" id="next-btn" style="display: none;">Next Sentence ➔</button>
    </div>
  </div>

  <div class="card" id="json-card" style="display: none;">
    <h3>Paste AI JSON Output Here:</h3>
    <textarea id="json-input" placeholder="Paste JSON generated by Gemini/ChatGPT here..."></textarea>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn btn-primary" id="load-json-btn">Load Sentences</button>
      <button class="btn" id="clear-json-btn">Clear Text</button>
    </div>
  </div>
</div>

<script>
  const rawDefaultData = [
    {
      english: "I want to drink hot tea today because I have a cold.",
      clauses: [
        {
          english: "I want to drink hot tea today",
          chinese: [ {word: "我", pinyin: "wǒ"}, {word: "今天", pinyin: "jīntiān"}, {word: "想", pinyin: "xiǎng"}, {word: "喝", pinyin: "hē"}, {word: "热茶", pinyin: "rèchá"} ]
        },
        {
          english: "because I have a cold.",
          chinese: [ {word: "因为", pinyin: "yīnwèi"}, {word: "我", pinyin: "wǒ"}, {word: "感冒了", pinyin: "gǎnmào le"} ]
        }
      ]
    },
    {
      english: "Although Chinese grammar is difficult, it is very interesting.",
      clauses: [
        {
          english: "Although Chinese grammar is difficult,",
          chinese: [ {word: "虽然", pinyin: "suīrán"}, {word: "中文", pinyin: "zhōngwén"}, {word: "语法", pinyin: "yǔfǎ"}, {word: "有点", pinyin: "yǒudiǎn"}, {word: "难", pinyin: "nán"} ]
        },
        {
          english: "it is very interesting.",
          chinese: [ {word: "但是", pinyin: "dànshì"}, {word: "很有趣", pinyin: "hěn yǒuqù"} ]
        }
      ]
    }
  ];

  let sentences = [];
  let currentIdx = 0;
  
  let currentClauseIdx = 0;
  let currentWordInClauseIdx = 0;
  let wordBank = [];
  let usedTileIds = new Set();
  let activeClauseTiles = [];
  let completedClauseGroups = [];

  const englishEl = document.getElementById('english-text');
  const clauseTracker = document.getElementById('clause-tracker');
  const clauseTrackerList = document.getElementById('clause-tracker-list');
  const activeClauseHint = document.getElementById('active-clause-hint');
  const sentenceZone = document.getElementById('sentence-zone');
  const wordBankEl = document.getElementById('word-bank');
  const counterEl = document.getElementById('sentence-counter');
  const dotsEl = document.getElementById('dots-container');
  const nextBtn = document.getElementById('next-btn');
  const resetClauseBtn = document.getElementById('reset-clause-btn');
  const jsonToggle = document.getElementById('json-toggle');
  const jsonCard = document.getElementById('json-card');
  const jsonInput = document.getElementById('json-input');
  const loadJsonBtn = document.getElementById('load-json-btn');
  const clearJsonBtn = document.getElementById('clear-json-btn');

  function normalizeData(raw) {
    return raw.map(s => {
      let clausesNormalized = [];
      if (Array.isArray(s.clauses)) {
        clausesNormalized = s.clauses.map((c, cIdx) => {
          if (c && !Array.isArray(c) && c.chinese) {
            return {
              english: c.english || `Clause ${cIdx + 1}`,
              chinese: c.chinese.map(item => ({
                word: item.word || item.char || '',
                pinyin: item.pinyin || ''
              }))
            };
          }
          if (Array.isArray(c)) {
            return {
              english: `Clause ${cIdx + 1}`,
              chinese: c.map(item => {
                if (typeof item === 'string') return { word: item, pinyin: '' };
                return { word: item.word || item.char || '', pinyin: item.pinyin || '' };
              })
            };
          }
          return { english: '', chinese: [] };
        });
      }
      return {
        english: s.english || '',
        clauses: clausesNormalized
      };
    });
  }

  function initGame() {
    sentences = normalizeData(rawDefaultData);
    renderDots();
    loadSentence(currentIdx);
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    sentences.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.className = `dot ${idx === currentIdx ? 'active' : ''} ${idx < currentIdx ? 'done' : ''}`;
      dotsEl.appendChild(dot);
    });
  }

  function loadSentence(index) {
    nextBtn.style.display = 'none';
    currentClauseIdx = 0;
    currentWordInClauseIdx = 0;
    usedTileIds.clear();
    activeClauseTiles = [];
    completedClauseGroups = [];
    
    const item = sentences[index];
    counterEl.innerText = `Sentence ${index + 1} of ${sentences.length}`;
    englishEl.innerText = item.english;

    if (item.clauses && item.clauses.length > 1) {
      clauseTracker.style.display = 'flex';
      renderClauseTracker(item);
    } else {
      clauseTracker.style.display = 'none';
    }

    let tiles = [];
    item.clauses.forEach((clauseObj, cIdx) => {
      clauseObj.chinese.forEach((wordObj, wIdx) => {
        tiles.push({
          id: `tile-${cIdx}-${wIdx}-${Math.random().toString(36).substr(2, 6)}`,
          word: wordObj.word,
          pinyin: wordObj.pinyin,
          clauseIdx: cIdx
        });
      });
    });

    wordBank = tiles.sort(() => Math.random() - 0.5);
    renderBoard();
  }

  function renderClauseTracker(item) {
    clauseTrackerList.innerHTML = '';
    item.clauses.forEach((cObj, idx) => {
      const div = document.createElement('div');
      div.className = 'english-clause-item';
      
      if (idx < currentClauseIdx) {
        div.className += ' completed';
        div.innerText = `✓ ${cObj.english}`;
      } else if (idx === currentClauseIdx) {
        div.className += ' active';
        div.innerText = `▶ ${cObj.english} (Current)`;
      } else {
        div.className += ' upcoming';
        div.innerText = `${idx + 1}. ${cObj.english}`;
      }
      clauseTrackerList.appendChild(div);
    });
  }

  function createTileElement(tileObj, isLocked = false) {
    const el = document.createElement('div');
    el.className = `tile ${isLocked ? 'locked' : ''}`;
    
    if (tileObj.pinyin) {
      const pinyinSpan = document.createElement('span');
      pinyinSpan.className = 'pinyin-text';
      pinyinSpan.innerText = tileObj.pinyin;
      el.appendChild(pinyinSpan);
    }

    const charSpan = document.createElement('span');
    charSpan.className = 'char-text';
    charSpan.innerText = tileObj.word;
    el.appendChild(charSpan);

    return el;
  }

  function renderBoard() {
    const currentSentence = sentences[currentIdx];
    sentenceZone.innerHTML = '';

    if (currentSentence.clauses && currentSentence.clauses.length > 1) {
      renderClauseTracker(currentSentence);
    }

    if (currentSentence.clauses && currentSentence.clauses[currentClauseIdx]) {
      const activeClauseObj = currentSentence.clauses[currentClauseIdx];
      activeClauseHint.innerText = `🎯 Target Clause: "${activeClauseObj.english}"`;
      activeClauseHint.style.display = 'block';
    } else {
      activeClauseHint.style.display = 'none';
    }

    // 1. Render Completed Clause Checkpoints
    completedClauseGroups.forEach((groupTiles) => {
      const group = document.createElement('div');
      group.className = 'clause-group completed';
      groupTiles.forEach(tileObj => {
        group.appendChild(createTileElement(tileObj, true));
      });
      sentenceZone.appendChild(group);
    });

    // 2. Render Active Clause Progress
    if (activeClauseTiles.length > 0 || currentClauseIdx < currentSentence.clauses.length) {
      const activeGroup = document.createElement('div');
      activeGroup.className = 'clause-group active-draft';
      activeClauseTiles.forEach(tileObj => {
        activeGroup.appendChild(createTileElement(tileObj, false));
      });
      sentenceZone.appendChild(activeGroup);
    }

    // 3. Render Word Bank with Subtle Active Clause Highlights
    wordBankEl.innerHTML = '';
    wordBank.forEach(tileObj => {
      const btn = createTileElement(tileObj, false);
      btn.tagName = 'BUTTON';
      
      if (currentSentence.clauses.length > 1 && tileObj.clauseIdx === currentClauseIdx) {
        btn.classList.add('active-clause-tile');
      }

      const isUsed = usedTileIds.has(tileObj.id);
      if (isUsed) {
        btn.setAttribute('disabled', 'true');
      } else {
        btn.onclick = () => handleTileClick(tileObj);
      }

      wordBankEl.appendChild(btn);
    });

    renderDots();
  }

  function handleTileClick(tileObj) {
    const currentSentence = sentences[currentIdx];
    const expectedWordObj = currentSentence.clauses[currentClauseIdx].chinese[currentWordInClauseIdx];

    if (tileObj.word === expectedWordObj.word) {
      usedTileIds.add(tileObj.id);
      activeClauseTiles.push(tileObj);
      currentWordInClauseIdx++;

      // Clause Completed?
      if (currentWordInClauseIdx >= currentSentence.clauses[currentClauseIdx].chinese.length) {
        completedClauseGroups.push([...activeClauseTiles]);
        activeClauseTiles = [];
        currentClauseIdx++;
        currentWordInClauseIdx = 0;
      }

      // Entire Sentence Completed?
      if (currentClauseIdx >= currentSentence.clauses.length) {
        nextBtn.style.display = 'inline-block';
      }

      renderBoard();
    } else {
      sentenceZone.classList.add('wrong');
      setTimeout(() => sentenceZone.classList.remove('wrong'), 400);

      activeClauseTiles.forEach(t => usedTileIds.delete(t.id));
      activeClauseTiles = [];
      currentWordInClauseIdx = 0;

      renderBoard();
    }
  }

  resetClauseBtn.onclick = () => {
    nextBtn.style.display = 'none';

    if (activeClauseTiles.length > 0) {
      activeClauseTiles.forEach(t => usedTileIds.delete(t.id));
      activeClauseTiles = [];
      currentWordInClauseIdx = 0;
    } else if (completedClauseGroups.length > 0) {
      const poppedGroup = completedClauseGroups.pop();
      poppedGroup.forEach(t => usedTileIds.delete(t.id));
      currentClauseIdx--;
      currentWordInClauseIdx = 0;
      activeClauseTiles = [];
    }

    renderBoard();
  };

  nextBtn.onclick = () => {
    if (currentIdx < sentences.length - 1) {
      currentIdx++;
      loadSentence(currentIdx);
    } else {
      alert('🎉 Excellent job! You finished all sentences in this set!');
    }
  };

  jsonToggle.onclick = () => {
    jsonCard.style.display = jsonCard.style.display === 'none' ? 'block' : 'none';
  };

  clearJsonBtn.onclick = () => {
    jsonInput.value = '';
    jsonInput.focus();
  };

  loadJsonBtn.onclick = () => {
    try {
      const parsed = JSON.parse(jsonInput.value.trim());
      if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].clauses) {
        sentences = normalizeData(parsed);
        currentIdx = 0;
        jsonCard.style.display = 'none';
        renderDots();
        loadSentence(0);
      } else {
        alert('Invalid format. Ensure it matches the JSON prompt output.');
      }
    } catch (e) {
      alert('Error parsing JSON. Please check for syntax errors.');
    }
  };

  initGame();
</script>

</body>
</html>
